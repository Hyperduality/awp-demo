name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  conformance:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        demo: [{ name: sorter, port: 8712 }, { name: vault, port: 8713 }]
    env:
      AWP_TOKEN: ci-conformance-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: Start the world
        working-directory: apps/${{ matrix.demo.name }}
        run: |
          AWP_AUDIT_DIR=conformance/audit pnpm world > world.log 2>&1 &
          for i in $(seq 1 30); do nc -z 127.0.0.1 ${{ matrix.demo.port }} && break; sleep 1; done
      - name: Run awp-conformance
        working-directory: apps/${{ matrix.demo.name }}
        run: |
          export WORLD_PID=$(lsof -ti tcp:${{ matrix.demo.port }} -sTCP:LISTEN | head -1)
          uvx --prerelease allow awp-conformance==0.1.0a7 world ws://127.0.0.1:${{ matrix.demo.port }} \
            --token "$AWP_TOKEN" --fixture conformance/fixture.json --out conformance/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ matrix.demo.name }}
          path: apps/${{ matrix.demo.name }}/conformance/report

[project]
name = "awp-minecraft-policy"
version = "0.1.0"
description = "MineStudio's VPT policy behind a WebSocket: a frame in, a slot of device input out."
requires-python = ">=3.10,<3.11"
dependencies = [
    "minestudio==1.1.3",
    "psutil>=7.2",
    # MineStudio imports `from cuda import cuda, cudart`, which cuda-python 13 removed.
    "cuda-python==12.9.0",
    "numpy<2",
    "opencv-python==4.8.0.74",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "websockets>=15",
]

[project.scripts]
awp-minecraft-policy = "awp_minecraft_policy.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
